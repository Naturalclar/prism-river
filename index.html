<title>Prism River</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ── tokens: dark-first (a console lives in a dim room) ───────────────── */
:root{
  --bg:#12161B; --panel:#191F26; --lane:#1E252E; --lane-alt:#212934;
  --line:#2E3742; --line-strong:#3E4A58;
  --text:#E6EBF1; --text-dim:#90A0B0; --text-faint:#64717F;
  --accent:#FF9F45; --accent-ink:#2A1A08; --accent-soft:rgba(255,159,69,.16);
  --danger:#FF6B6B; --good:#5FD3A0;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 12px rgba(0,0,0,.35);
  --wave-bg:rgba(255,255,255,.03);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E9ECEF; --panel:#F7F8FA; --lane:#FFFFFF; --lane-alt:#F3F5F8;
    --line:#D6DBE1; --line-strong:#B6BFC9;
    --text:#171D24; --text-dim:#57646F; --text-faint:#8B959F;
    --accent:#C2680C; --accent-ink:#FFF6EA; --accent-soft:rgba(194,104,12,.12);
    --danger:#C4342F; --good:#0F8A5F;
    --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 6px rgba(20,30,40,.12);
    --wave-bg:rgba(20,30,40,.035);
  }
}
:root[data-theme="light"]{
  --bg:#E9ECEF; --panel:#F7F8FA; --lane:#FFFFFF; --lane-alt:#F3F5F8;
  --line:#D6DBE1; --line-strong:#B6BFC9;
  --text:#171D24; --text-dim:#57646F; --text-faint:#8B959F;
  --accent:#C2680C; --accent-ink:#FFF6EA; --accent-soft:rgba(194,104,12,.12);
  --danger:#C4342F; --good:#0F8A5F;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 6px rgba(20,30,40,.12);
  --wave-bg:rgba(20,30,40,.035);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ── transport ───────────────────────────────────────────────────────── */
.deck{
  flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--line);
  box-shadow:var(--shadow); display:flex; align-items:center; gap:18px;
  padding:10px 16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:2px}
.brand h1{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700;
  font-size:19px; letter-spacing:.02em; margin:0;
}
.brand small{color:var(--text-faint); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase}

.keys{display:flex; gap:6px}
.key{
  width:40px; height:34px; border-radius:5px; background:var(--lane-alt);
  border:1px solid var(--line-strong); display:grid; place-items:center;
  transition:background .12s, border-color .12s;
}
.key:hover:not(:disabled){border-color:var(--accent)}
.key:disabled{opacity:.38; cursor:not-allowed}
.key svg{width:15px; height:15px; fill:currentColor}
.key.lit{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

.clock{
  font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:23px; letter-spacing:.01em; padding:3px 12px; border-radius:5px;
  background:var(--lane); border:1px solid var(--line); min-width:132px; text-align:center;
}
.clock b{font-weight:500}
.clock i{font-style:normal; color:var(--text-faint); font-size:15px}

.pot{display:flex; align-items:center; gap:8px}
.pot label{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint)}
input[type=range]{
  -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
  background:var(--line-strong); cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--accent); border:2px solid var(--panel); cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:13px; height:13px; border-radius:50%; background:var(--accent);
  border:2px solid var(--panel); cursor:pointer;
}

.meter{display:flex; flex-direction:column; gap:2px; width:60px}
.meter span{height:5px; border-radius:2px; background:var(--line-strong); overflow:hidden}
.meter span i{display:block; height:100%; width:0%; background:var(--good); transition:width .05s linear}
.meter span i.hot{background:var(--danger)}

.spacer{flex:1 1 auto}
.acts{display:flex; gap:8px; flex-wrap:wrap}

.ghost{
  padding:7px 12px; border-radius:5px; border:1px solid var(--line-strong);
  font-size:12.5px; background:var(--lane-alt); transition:border-color .12s;
}
.ghost:hover:not(:disabled){border-color:var(--accent)}
.ghost:disabled{opacity:.38; cursor:not-allowed}

/* ── workspace ───────────────────────────────────────────────────────── */
.stage{flex:1 1 auto; display:grid; grid-template-columns:214px 1fr; min-height:0; position:relative}
.rack{
  background:var(--panel); border-right:1px solid var(--line);
  overflow:hidden; display:flex; flex-direction:column;
}
.rack-top{
  height:30px; flex:0 0 auto; border-bottom:1px solid var(--line);
  display:flex; align-items:center; padding:0 12px;
  font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-faint);
}
.rack-list{flex:1 1 auto; overflow:hidden}

.reel{overflow:auto; position:relative}
.ruler{
  height:30px; position:sticky; top:0; z-index:3; background:var(--panel);
  border-bottom:1px solid var(--line);
}
.lanes{position:relative}

/* track header */
.head{
  height:88px; border-bottom:1px solid var(--line); padding:8px 10px;
  display:flex; flex-direction:column; gap:6px; position:relative;
}
.head::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--tc)}
.head-row{display:flex; align-items:center; gap:6px}
.head-name{
  flex:1 1 auto; font-size:12.5px; font-weight:500; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;
}
.tog{
  width:22px; height:20px; border-radius:4px; border:1px solid var(--line-strong);
  font-size:9.5px; font-weight:600; letter-spacing:.04em; display:grid; place-items:center;
  color:var(--text-dim); background:var(--lane);
}
.tog[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.tog.x[aria-pressed="true"]{background:var(--danger); border-color:var(--danger); color:#fff}
.head-pot{display:flex; align-items:center; gap:6px}
.head-pot span{font-size:9.5px; letter-spacing:.08em; color:var(--text-faint); width:15px}
.head-pot input{flex:1 1 auto; min-width:0}
.head-pot em{font-style:normal; font-size:10px; color:var(--text-faint); width:30px; text-align:right}

/* lane */
.lane{
  height:88px; border-bottom:1px solid var(--line); position:relative;
  background:var(--lane);
}
.lane:nth-child(even){background:var(--lane-alt)}
.clip{
  position:absolute; top:6px; bottom:6px; border-radius:4px; overflow:hidden;
  background:var(--wave-bg); border:1px solid var(--tc);
  cursor:grab; touch-action:none;
}
.clip.dragging{cursor:grabbing; box-shadow:0 0 0 2px var(--accent)}
.clip canvas{display:block; width:100%; height:100%}
.clip .tag{
  position:absolute; left:5px; top:3px; font-size:9.5px; letter-spacing:.05em;
  color:var(--tc); font-weight:600; pointer-events:none;
  text-shadow:0 1px 3px var(--bg);
}
.clip.off{opacity:.3}

.needle{
  position:absolute; top:0; bottom:0; width:1px; background:var(--accent);
  pointer-events:none; z-index:4;
}
.needle::before{
  content:""; position:absolute; top:0; left:-5px; border:5px solid transparent;
  border-top-color:var(--accent); border-bottom:none; height:0;
}

/* empty + drop */
.blank{
  position:absolute; inset:30px 0 0 0; display:grid; place-content:center;
  gap:10px; text-align:center; color:var(--text-faint); pointer-events:none;
}
.blank strong{
  display:block; font-family:"IBM Plex Sans Condensed",sans-serif;
  font-size:17px; font-weight:600; color:var(--text-dim);
}
.blank span{font-size:12.5px}
.catch{
  position:absolute; inset:0; z-index:9; display:none; place-content:center;
  background:var(--accent-soft); border:2px dashed var(--accent);
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:19px; color:var(--accent);
}
.stage.armed .catch{display:grid}

/* ── telemetry ───────────────────────────────────────────────────────── */
.probe{
  flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
  display:flex; gap:0; align-items:stretch; overflow-x:auto;
}
.cell{padding:7px 14px; border-right:1px solid var(--line); white-space:nowrap}
.cell dt{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin:0}
.cell dd{
  margin:1px 0 0; font-family:"IBM Plex Mono",monospace; font-size:12.5px;
  font-variant-numeric:tabular-nums;
}
.cell dd.ok{color:var(--good)}
.cell dd.no{color:var(--danger)}
.log{
  flex:1 1 auto; padding:7px 14px; font-family:"IBM Plex Mono",monospace;
  font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; align-self:center;
}
</style>

<div class="deck">
  <div class="brand">
    <h1>Prism River</h1>
    <small>Multitrack in the browser</small>
  </div>

  <div class="keys">
    <button class="key" id="kPlay" disabled title="再生 / 一時停止 (Space)" aria-label="再生">
      <svg viewBox="0 0 16 16" id="kPlayIcon"><path d="M3 2l11 6-11 6z"/></svg>
    </button>
    <button class="key" id="kStop" disabled title="停止 (先頭へ戻る)" aria-label="停止">
      <svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg>
    </button>
    <button class="key" id="kLoop" disabled title="ループ" aria-label="ループ" aria-pressed="false">
      <svg viewBox="0 0 16 16"><path d="M4 4h7v2l3-3-3-3v2H2v5h2V4zm8 8H5v-2l-3 3 3 3v-2h9V9h-2v3z"/></svg>
    </button>
  </div>

  <div class="clock mono"><b id="clkPos">00:00.00</b> <i id="clkLen">/ 00:00.00</i></div>

  <div class="pot">
    <label for="mVol">Master</label>
    <input type="range" id="mVol" min="0" max="1.4" step="0.01" value="0.9" style="width:88px">
    <div class="meter" aria-hidden="true">
      <span><i id="mL"></i></span>
      <span><i id="mR"></i></span>
    </div>
  </div>

  <div class="pot">
    <label for="zoom">Zoom</label>
    <input type="range" id="zoom" min="8" max="400" step="1" value="70" style="width:76px">
  </div>

  <div class="spacer"></div>

  <div class="acts">
    <button class="ghost" id="kAdd">音声を追加</button>
    <button class="ghost" id="kBounce" disabled>ミックスを書き出す</button>
    <button class="ghost" id="kAudition" hidden>レンダーを試聴</button>
  </div>
  <input type="file" id="picker" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg,.flac" multiple hidden>
</div>

<div class="stage" id="stage">
  <div class="rack">
    <div class="rack-top">Tracks</div>
    <div class="rack-list" id="rack"></div>
  </div>

  <div class="reel" id="reel">
    <canvas class="ruler" id="ruler"></canvas>
    <div class="lanes" id="lanes"></div>
    <div class="needle" id="needle" style="display:none"></div>
    <div class="blank" id="blank">
      <strong>音声ファイルをここへドロップ</strong>
      <span>mp3 / wav / m4a / ogg / flac — 1ファイル＝1トラック<br>ファイルはこの端末から出ません（サーバー送信なし）</span>
    </div>
  </div>

  <div class="catch">ドロップして読み込む</div>
</div>

<dl class="probe">
  <div class="cell"><dt>Sample rate</dt><dd id="pSr">—</dd></div>
  <div class="cell"><dt>Output latency</dt><dd id="pLat">—</dd></div>
  <div class="cell"><dt>Tracks</dt><dd id="pTrk">0</dd></div>
  <div class="cell"><dt>Decoded</dt><dd id="pDec">—</dd></div>
  <div class="cell"><dt>RAM (PCM)</dt><dd id="pRam">—</dd></div>
  <div class="cell"><dt>Offline render</dt><dd id="pOff">—</dd></div>
  <div class="log" id="log">音声ファイルを読み込むと計測が始まります。</div>
</dl>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
/* 先頭3色は騒霊三姉妹。弦=ルナサ / 管=メルラン / 鍵盤=リリカ。
   4本目以降は同系統から外して、隣り合うトラックが混ざらないようにする。 */
const HUE = ["#6E8FD4","#E8735A","#A585D6","#E0A93B","#63BE8C","#D66FA0"];
const LANE_H = 88, CLIP_PAD = 6;

let ctx = null, master = null, analyser = null, splitter = null;
let tracks = [], pxPerSec = 70, playing = false, looping = false;
let seekAt = 0, startedAt = 0, raf = 0, decodeTotal = 0, nextHue = 0;
let lastRender = null, auditionSrc = null;

const say = m => { $("log").textContent = m; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function tc(s){
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0") + ":" + r.toFixed(2).padStart(5,"0");
}

/* ── audio graph ─────────────────────────────────────────────────────── */
function audio(){
  if (ctx) return ctx;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = parseFloat($("mVol").value);
  splitter = ctx.createChannelSplitter(2);
  const aL = ctx.createAnalyser(), aR = ctx.createAnalyser();
  aL.fftSize = aR.fftSize = 256;
  master.connect(splitter);
  splitter.connect(aL, 0); splitter.connect(aR, 1);
  master.connect(ctx.destination);
  analyser = { L:aL, R:aR, bL:new Uint8Array(aL.fftSize), bR:new Uint8Array(aR.fftSize) };

  $("pSr").textContent = ctx.sampleRate.toLocaleString() + " Hz";
  const lat = ctx.outputLatency ?? ctx.baseLatency;
  $("pLat").textContent = lat ? (lat*1000).toFixed(1) + " ms" : "非公開";
  return ctx;
}

/* ── loading ─────────────────────────────────────────────────────────── */
async function ingest(files){
  const list = [...files].filter(f => /^audio\//.test(f.type) || /\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(f.name));
  if (!list.length){ say("音声ファイルが見つかりませんでした。"); return; }
  audio();
  if (ctx.state === "suspended") await ctx.resume();

  for (const f of list){
    say(`読み込み中: ${f.name} …`);
    try {
      const bytes = await f.arrayBuffer();
      const t0 = performance.now();
      const buf = await ctx.decodeAudioData(bytes);
      const ms = performance.now() - t0;
      decodeTotal += ms;
      add(f, buf, ms);
      say(`${f.name} — ${buf.duration.toFixed(2)}s / ${buf.numberOfChannels}ch / ${buf.sampleRate}Hz / デコード ${ms.toFixed(0)}ms`);
    } catch (e){
      say(`${f.name} をデコードできませんでした（この形式はブラウザが対応していません）`);
    }
  }
  refresh();
}

function add(file, buf, ms){
  const gain = ctx.createGain(), pan = ctx.createStereoPanner();
  gain.connect(pan); pan.connect(master);
  const t = {
    id: Math.random().toString(36).slice(2),
    name: file.name.replace(/\.[^.]+$/, ""),
    buf, gain, pan, src: null,
    vol: 0.85, panv: 0, mute: false, solo: false,
    offset: 0, color: HUE[nextHue++ % HUE.length], decodeMs: ms, peaks: null,
  };
  gain.gain.value = t.vol;
  tracks.push(t);
}

function drop(t){
  stopSrc(t);
  try { t.gain.disconnect(); t.pan.disconnect(); } catch(e){}
  tracks = tracks.filter(x => x !== t);
  refresh();
  if (!tracks.length) halt();
}

/* ── peaks ───────────────────────────────────────────────────────────── */
function peaks(t, cols){
  if (t.peaks && t.peaks.cols === cols) return t.peaks;
  const ch = t.buf.getChannelData(0);
  const per = ch.length / cols, hi = new Float32Array(cols), lo = new Float32Array(cols);
  for (let c = 0; c < cols; c++){
    const s = Math.floor(c*per), e = Math.min(ch.length, Math.floor((c+1)*per));
    let mn = 0, mx = 0;
    for (let i = s; i < e; i++){ const v = ch[i]; if (v > mx) mx = v; else if (v < mn) mn = v; }
    hi[c] = mx; lo[c] = mn;
  }
  t.peaks = { cols, hi, lo };
  return t.peaks;
}

function paint(t, cv){
  const w = Math.max(1, Math.round(t.buf.duration * pxPerSec));
  const h = LANE_H - CLIP_PAD*2 - 2;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+"px"; cv.style.height = h+"px";
  const g = cv.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0,0,w,h);
  const p = peaks(t, w), mid = h/2;
  g.fillStyle = t.color;
  for (let x = 0; x < w; x++){
    const up = Math.max(1, p.hi[x]*mid), dn = Math.max(1, -p.lo[x]*mid);
    g.fillRect(x, mid-up, 1, up+dn);
  }
  g.globalAlpha = .45;
  g.fillRect(0, mid, w, 1);
}

/* ── render ──────────────────────────────────────────────────────────── */
function total(){
  return tracks.reduce((m,t) => Math.max(m, t.offset + t.buf.duration), 0);
}

function refresh(){
  const rack = $("rack"), lanes = $("lanes");
  rack.textContent = ""; lanes.textContent = "";

  tracks.forEach(t => {
    /* header */
    const h = document.createElement("div");
    h.className = "head"; h.style.setProperty("--tc", t.color);
    h.innerHTML = `
      <div class="head-row">
        <div class="head-name" title="${esc(t.name)}">${esc(t.name)}</div>
        <button class="tog" aria-pressed="${t.solo}" title="ソロ">S</button>
        <button class="tog x" aria-pressed="${t.mute}" title="ミュート">M</button>
        <button class="tog" title="削除" style="border-color:transparent">✕</button>
      </div>
      <div class="head-pot"><span>VOL</span><input type="range" min="0" max="1.4" step="0.01" value="${t.vol}"><em>${Math.round(t.vol*100)}</em></div>
      <div class="head-pot"><span>PAN</span><input type="range" min="-1" max="1" step="0.02" value="${t.panv}"><em>${panLabel(t.panv)}</em></div>`;

    const [bSolo, bMute, bKill] = h.querySelectorAll(".tog");
    const [rVol, rPan] = h.querySelectorAll("input");
    bSolo.onclick = () => { t.solo = !t.solo; bSolo.setAttribute("aria-pressed", t.solo); balance(); dim(); };
    bMute.onclick = () => { t.mute = !t.mute; bMute.setAttribute("aria-pressed", t.mute); balance(); dim(); };
    bKill.onclick = () => drop(t);
    rVol.oninput = () => { t.vol = +rVol.value; rVol.nextElementSibling.textContent = Math.round(t.vol*100); balance(); };
    rPan.oninput = () => { t.panv = +rPan.value; rPan.nextElementSibling.textContent = panLabel(t.panv); t.pan.pan.value = t.panv; };
    rack.appendChild(h);

    /* lane */
    const lane = document.createElement("div");
    lane.className = "lane";
    const clip = document.createElement("div");
    clip.className = "clip"; clip.style.setProperty("--tc", t.color);
    clip.style.left = (t.offset*pxPerSec) + "px";
    clip.style.width = (t.buf.duration*pxPerSec) + "px";
    const cv = document.createElement("canvas");
    clip.appendChild(cv);
    const tag = document.createElement("div");
    tag.className = "tag"; tag.textContent = t.name;
    clip.appendChild(tag);
    lane.appendChild(clip);
    lanes.appendChild(lane);
    t.el = clip;
    paint(t, cv);
    slide(t, clip);
  });

  $("lanes").style.width = width() + "px";
  $("pTrk").textContent = tracks.length;
  $("pDec").textContent = decodeTotal ? decodeTotal.toFixed(0) + " ms" : "—";
  $("pRam").textContent = tracks.length ? (ram()/1048576).toFixed(1) + " MB" : "—";
  $("blank").style.display = tracks.length ? "none" : "grid";
  $("clkLen").textContent = "/ " + tc(total());
  for (const b of ["kPlay","kStop","kLoop","kBounce"]) $(b).disabled = !tracks.length;
  ruler(); dim(); balance();
}

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const panLabel = v => v === 0 ? "C" : (v < 0 ? "L" : "R") + Math.round(Math.abs(v)*100);
const ram = () => tracks.reduce((n,t) => n + t.buf.length*t.buf.numberOfChannels*4, 0);
const width = () => Math.max($("reel").clientWidth, Math.ceil(total()*pxPerSec) + 240);

function dim(){
  const solo = tracks.some(t => t.solo);
  tracks.forEach(t => t.el && t.el.classList.toggle("off", t.mute || (solo && !t.solo)));
}

function balance(){
  const solo = tracks.some(t => t.solo);
  tracks.forEach(t => {
    const on = !t.mute && (!solo || t.solo);
    t.gain.gain.value = on ? t.vol : 0;
  });
}

/* ── ruler ───────────────────────────────────────────────────────────── */
function ruler(){
  const cv = $("ruler"), w = width(), h = 30;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+"px"; cv.style.height = h+"px";
  const g = cv.getContext("2d");
  g.scale(dpr,dpr);
  const css = getComputedStyle(document.body);
  g.clearRect(0,0,w,h);
  const faint = css.getPropertyValue("--text-faint").trim();
  const line = css.getPropertyValue("--line-strong").trim();

  const steps = [0.1,0.25,0.5,1,2,5,10,15,30,60,120,300];
  const step = steps.find(s => s*pxPerSec >= 62) || 600;
  g.font = '500 10px "IBM Plex Mono", monospace';
  g.textBaseline = "alphabetic";
  for (let s = 0; s*pxPerSec <= w; s += step){
    const x = Math.round(s*pxPerSec) + .5;
    g.strokeStyle = line; g.beginPath(); g.moveTo(x, 18); g.lineTo(x, 30); g.stroke();
    /* 刻みが1秒未満のときに小数を落とすと同じラベルが並ぶので、桁を残す */
    const label = step >= 1 ? tc(s).replace(/\.\d+$/, "") : tc(s).replace(/(\.\d)\d$/, "$1");
    g.fillStyle = faint; g.fillText(label, x+4, 14);
    const sub = step/ (step >= 1 ? 4 : 2);
    for (let k = 1; k < (step >= 1 ? 4 : 2); k++){
      const xx = Math.round((s+sub*k)*pxPerSec) + .5;
      if (xx > w) break;
      g.strokeStyle = line; g.globalAlpha = .5;
      g.beginPath(); g.moveTo(xx, 24); g.lineTo(xx, 30); g.stroke();
      g.globalAlpha = 1;
    }
  }
}

/* ── clip dragging ───────────────────────────────────────────────────── */
function slide(t, el){
  let id = null, x0 = 0, off0 = 0, moved = false;
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    id = e.pointerId; x0 = e.clientX; off0 = t.offset; moved = false;
    el.setPointerCapture(id); el.classList.add("dragging");
  });
  el.addEventListener("pointermove", e => {
    if (id === null || e.pointerId !== id) return;
    const d = (e.clientX - x0) / pxPerSec;
    if (Math.abs(e.clientX - x0) > 2) moved = true;
    t.offset = Math.max(0, off0 + d);
    el.style.left = (t.offset*pxPerSec) + "px";
    $("clkLen").textContent = "/ " + tc(total());
  });
  const end = e => {
    if (id === null || (e.pointerId !== undefined && e.pointerId !== id)) return;
    el.releasePointerCapture(id); id = null; el.classList.remove("dragging");
    if (moved){
      $("lanes").style.width = width() + "px";
      ruler();
      say(`${t.name} の開始位置: ${tc(t.offset)}`);
      if (playing){ const at = now(); halt(true); seekAt = at; go(); }
    }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ── transport ───────────────────────────────────────────────────────── */
function now(){
  return playing ? Math.min(total(), seekAt + (ctx.currentTime - startedAt)) : seekAt;
}

function stopSrc(t){
  if (t.src){ try { t.src.onended = null; t.src.stop(); } catch(e){} t.src = null; }
}

function go(){
  if (!tracks.length) return;
  audio();
  if (ctx.state === "suspended") ctx.resume();
  const at = ctx.currentTime + 0.06;
  startedAt = at;
  tracks.forEach(t => {
    stopSrc(t);
    const local = seekAt - t.offset;
    if (local >= t.buf.duration) return;
    const s = ctx.createBufferSource();
    s.buffer = t.buf; s.connect(t.gain);
    if (local >= 0) s.start(at, local);
    else s.start(at - local);
    t.src = s;
  });
  playing = true;
  $("kPlay").classList.add("lit");
  $("kPlayIcon").innerHTML = '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>';
  $("needle").style.display = "block";
  tick();
}

function halt(quiet){
  tracks.forEach(stopSrc);
  if (playing && !quiet) seekAt = Math.min(total(), now());
  playing = false;
  cancelAnimationFrame(raf);
  $("kPlay").classList.remove("lit");
  $("kPlayIcon").innerHTML = '<path d="M3 2l11 6-11 6z"/>';
  if (!quiet) paintNeedle();
}

function tick(){
  const t = now();
  paintNeedle();
  $("clkPos").textContent = tc(t);
  levels();
  if (t >= total() - 0.001 && total() > 0){
    if (looping){ seekAt = 0; halt(true); go(); return; }
    halt(); seekAt = 0; paintNeedle(); $("clkPos").textContent = tc(0);
    say("再生を終了しました。"); return;
  }
  raf = requestAnimationFrame(tick);
}

function paintNeedle(){
  const x = now()*pxPerSec;
  const n = $("needle");
  n.style.display = tracks.length ? "block" : "none";
  n.style.transform = `translateX(${x - $("reel").scrollLeft}px)`;
  n.style.left = "0px";
}

function levels(){
  if (!analyser) return;
  const rms = (a, b) => {
    a.getByteTimeDomainData(b);
    let s = 0;
    for (let i = 0; i < b.length; i++){ const v = (b[i]-128)/128; s += v*v; }
    return Math.sqrt(s/b.length);
  };
  const L = rms(analyser.L, analyser.bL), R = rms(analyser.R, analyser.bR);
  for (const [el, v] of [[$("mL"), L],[$("mR"), R]]){
    el.style.width = Math.min(100, v*180) + "%";
    el.classList.toggle("hot", v > 0.7);
  }
}

/* ── bounce ──────────────────────────────────────────────────────────── */
async function bounce(){
  const dur = total();
  if (!dur) return;
  $("kBounce").disabled = true;
  say("オフラインでミックスを描画中 …");
  const t0 = performance.now();
  const sr = ctx.sampleRate;
  const off = new OfflineAudioContext(2, Math.ceil(dur*sr) + sr*0.1, sr);
  const mg = off.createGain();
  mg.gain.value = parseFloat($("mVol").value);
  mg.connect(off.destination);
  const solo = tracks.some(t => t.solo);
  tracks.forEach(t => {
    const on = !t.mute && (!solo || t.solo);
    if (!on) return;
    const g = off.createGain(), p = off.createStereoPanner(), s = off.createBufferSource();
    g.gain.value = t.vol; p.pan.value = t.panv;
    s.buffer = t.buf; s.connect(g); g.connect(p); p.connect(mg);
    s.start(t.offset);
  });
  const rendered = await off.startRendering();
  const ms = performance.now() - t0;
  $("pOff").textContent = ms.toFixed(0) + " ms";
  $("pOff").className = "ok";

  lastRender = rendered;
  $("kAudition").hidden = false;

  const wav = encode(rendered);
  const rt = (dur/(ms/1000)).toFixed(0);
  const size = (wav.size/1048576).toFixed(1);
  say(`レンダー完了: ${dur.toFixed(2)}s / ${size}MB / 実時間の約${rt}倍速。保存を試みています …`);

  /* claude.ai のビューア内でだけ window.claude が生える。自分のドメインに
     置いたときは存在しないので、その場合は通常のダウンロードに落とす。 */
  const dl = window.claude ? await window.claude.use("downloads") : null;
  if (!dl && !window.claude){
    const url = URL.createObjectURL(wav);
    const a = document.createElement("a");
    a.href = url; a.download = "prism-river-mix.wav";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    say(`書き出しました: ${size}MB / 実時間の約${rt}倍速。`);
  } else if (!dl){
    say(`レンダー完了（${rt}倍速, ${size}MB）。このビューではファイル保存が使えないので、試聴のみ可能です。`);
  } else {
    try {
      await dl.save({ filename:"prism-river-mix.wav", data:wav });
      say(`保存しました。レンダーは実時間の約${rt}倍速（${size}MB）。`);
    } catch (err){
      const code = err && err.code;
      if (code === "rejected_extension" || code === "extension_not_enabled"){
        say(`レンダーは成功（${rt}倍速, ${size}MB）。ただし .wav はこのビューアの保存許可リストに無いため書き出せません — ブラウザの制限ではなく claude.ai 側の制限なので、自分のドメインに置けば普通に保存できます。ここでは「レンダーを試聴」で結果を確認してください。`);
      } else if (code === "too_large"){
        say(`レンダーは成功したが ${size}MB は保存上限(16MiB)超え。尺を削るか、自分のドメインで動かしてください。`);
      } else if (code === "declined"){
        say("保存はキャンセルされました。レンダー結果は「レンダーを試聴」で確認できます。");
      } else {
        say(`レンダーは成功（${rt}倍速）。保存は失敗しました: ${code || "不明なエラー"}`);
      }
    }
  }
  $("kBounce").disabled = false;
}

function audition(){
  if (!lastRender) return;
  if (auditionSrc){ try { auditionSrc.stop(); } catch(e){} auditionSrc = null; $("kAudition").textContent = "レンダーを試聴"; return; }
  halt(true);
  const s = ctx.createBufferSource();
  s.buffer = lastRender; s.connect(master); s.start();
  s.onended = () => { auditionSrc = null; $("kAudition").textContent = "レンダーを試聴"; };
  auditionSrc = s;
  $("kAudition").textContent = "試聴を止める";
  say(`レンダー結果を再生中（${lastRender.duration.toFixed(2)}s / ${lastRender.numberOfChannels}ch）。`);
}

function encode(buf){
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const data = new ArrayBuffer(44 + n*ch*2), v = new DataView(data);
  const str = (o,s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  str(0,"RIFF"); v.setUint32(4, 36 + n*ch*2, true); str(8,"WAVE");
  str(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,ch,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*ch*2,true); v.setUint16(32,ch*2,true); v.setUint16(34,16,true);
  str(36,"data"); v.setUint32(40, n*ch*2, true);
  const cd = [];
  for (let c = 0; c < ch; c++) cd.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++){
    for (let c = 0; c < ch; c++){
      const s = Math.max(-1, Math.min(1, cd[c][i]));
      v.setInt16(o, s < 0 ? s*0x8000 : s*0x7FFF, true);
      o += 2;
    }
  }
  return new Blob([data], { type:"audio/wav" });
}

/* ── wiring ──────────────────────────────────────────────────────────── */
$("kAdd").onclick = () => $("picker").click();
$("picker").onchange = e => { ingest(e.target.files); e.target.value = ""; };
$("kPlay").onclick = () => playing ? halt() : go();
$("kStop").onclick = () => { halt(true); seekAt = 0; paintNeedle(); $("clkPos").textContent = tc(0); };
$("kLoop").onclick = e => {
  looping = !looping;
  e.currentTarget.setAttribute("aria-pressed", looping);
  e.currentTarget.classList.toggle("lit", looping);
};
$("kBounce").onclick = bounce;
$("kAudition").onclick = audition;
$("mVol").oninput = e => { if (master) master.gain.value = +e.target.value; };
$("zoom").oninput = e => {
  const anchor = now();
  pxPerSec = +e.target.value;
  tracks.forEach(t => { t.peaks = null; });
  refresh();
  const reel = $("reel");
  reel.scrollLeft = Math.max(0, anchor*pxPerSec - reel.clientWidth/2);
  paintNeedle();
};

$("reel").addEventListener("scroll", paintNeedle, { passive:true });

$("ruler").addEventListener("pointerdown", e => {
  const r = $("ruler").getBoundingClientRect();
  const s = clamp((e.clientX - r.left) / pxPerSec, 0, total());
  seekAt = s;
  $("clkPos").textContent = tc(s);
  if (playing){ halt(true); go(); } else paintNeedle();
});

const stage = $("stage");
let depth = 0;
stage.addEventListener("dragenter", e => { e.preventDefault(); if (++depth === 1) stage.classList.add("armed"); });
stage.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
stage.addEventListener("dragleave", () => { if (--depth <= 0){ depth = 0; stage.classList.remove("armed"); } });
stage.addEventListener("drop", e => {
  e.preventDefault(); depth = 0; stage.classList.remove("armed");
  if (e.dataTransfer.files.length) ingest(e.dataTransfer.files);
});

addEventListener("keydown", e => {
  if (e.target.matches("input, button")) return;
  if (e.code === "Space"){ e.preventDefault(); if (tracks.length) playing ? halt() : go(); }
});

addEventListener("resize", () => {
  if (!tracks.length) return;
  $("lanes").style.width = width() + "px";
  ruler(); paintNeedle();
});

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (tracks.length) ruler(); });

$("pOff").textContent = "未実行";
ruler();
})();
</script>
